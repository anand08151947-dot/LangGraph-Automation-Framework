<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="#4F46E5"/>
  
  <!-- Neural network / brain nodes -->
  <!-- Center node -->
  <circle cx="32" cy="32" r="5" fill="white" opacity="0.95"/>

  <!-- Outer nodes -->
  <circle cx="16" cy="20" r="4" fill="white" opacity="0.8"/>
  <circle cx="48" cy="20" r="4" fill="white" opacity="0.8"/>
  <circle cx="12" cy="44" r="4" fill="white" opacity="0.8"/>
  <circle cx="52" cy="44" r="4" fill="white" opacity="0.8"/>
  <circle cx="32" cy="10" r="3.5" fill="white" opacity="0.7"/>
  <circle cx="32" cy="54" r="3.5" fill="white" opacity="0.7"/>

  <!-- Connection lines from center -->
  <line x1="32" y1="32" x2="16" y2="20" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="32" y1="32" x2="48" y2="20" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="32" y1="32" x2="12" y2="44" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="32" y1="32" x2="52" y2="44" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="32" y1="32" x2="32" y2="10" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="32" y1="32" x2="32" y2="54" stroke="white" stroke-width="1.5" opacity="0.5"/>

  <!-- Cross connections -->
  <line x1="16" y1="20" x2="32" y2="10" stroke="white" stroke-width="1" opacity="0.3"/>
  <line x1="48" y1="20" x2="32" y2="10" stroke="white" stroke-width="1" opacity="0.3"/>
  <line x1="16" y1="20" x2="12" y2="44" stroke="white" stroke-width="1" opacity="0.3"/>
  <line x1="48" y1="20" x2="52" y2="44" stroke="white" stroke-width="1" opacity="0.3"/>
  <line x1="12" y1="44" x2="32" y2="54" stroke="white" stroke-width="1" opacity="0.3"/>
  <line x1="52" y1="44" x2="32" y2="54" stroke="white" stroke-width="1" opacity="0.3"/>
</svg>
